name: Deploy GitHub Pages (extended wait)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-extended
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: https://haraken59-bot.github.io/hidaka-order/
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - name: Cancel stale Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for deployment in \
            7e063a5d5d0679c19b4ccbbdfd7bc6416d215a74 \
            6010f993a489bf543cd1f6d984e0d0e90a9157ff
          do
            code="$(curl --silent --show-error --location \
              --output cancel-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment}/cancel")"
            echo "Cancel ${deployment}: HTTP ${code}"
            if [[ "${code}" != "204" && "${code}" != "404" ]]; then
              cat cancel-response.json
              exit 1
            fi
          done
          sleep 15

      - name: Start GitHub Pages deployment
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for delayed Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240)
          do
            response="$(curl --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}" || true)"
            status="$(printf '%s' "${response}" | python3 -c 'import json, sys; data=json.load(sys.stdin); print(data.get("status", ""))' 2>/dev/null || true)"
            echo "Pages deployment status (${attempt}/240): ${status:-unavailable}"
            case "${status}" in
              succeed)
                exit 0
                ;;
              cancelled|failed|error)
                printf '%s\n' "${response}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo 'Pages deployment did not finish within the extended wait period.'
          exit 1
